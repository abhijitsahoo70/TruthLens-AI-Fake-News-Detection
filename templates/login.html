{% extends 'base.html' %}

{% block title %}User Login — TruthLens AI{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="glass-card">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon" style="margin: 0 auto 1rem auto; width: 48px; height: 48px; font-size: 1.5rem;">
        <i class="fa-solid fa-right-to-bracket"></i>
      </div>
      <h2>Welcome Back</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">
        Sign in to access your personal dashboard and analysis history
      </p>
    </div>

    <form action="{{ url_for('login') }}" method="POST">
      <div class="form-group">
        <label class="form-label" for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
        <input type="email" name="email" id="email" class="form-control" placeholder="name@example.com" value="{{ email or '' }}" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password"><i class="fa-solid fa-lock"></i> Password</label>
        <div style="position: relative;">
          <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
          <i class="fa-solid fa-eye toggle-password" data-target="password" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted);"></i>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
        <i class="fa-solid fa-right-to-bracket"></i> Sign In
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border-color); font-size: 0.9rem; color: var(--text-muted);">
      Don't have an account? <a href="{{ url_for('register') }}" style="font-weight: 600;">Create one here</a>
    </div>
  </div>
</div>
{% endblock %}
